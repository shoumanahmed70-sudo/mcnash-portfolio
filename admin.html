<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MCNASH · Studio Admin</title><link rel="stylesheet" href="style.css"><body><main class="admin"><a href="index.html">← View portfolio</a><h1>Studio admin</h1><p id="status" role="status"></p><form id="login"><label>Email<input name="email" type="email" autocomplete="username" required></label><label>Password<input name="password" type="password" autocomplete="current-password" required></label><button>Sign in</button></form><div id="panel" hidden><button id="logout">Sign out</button><h2>Profile</h2><form id="profile"><label>Opening text<textarea name="intro" required></textarea></label><label>About<textarea name="bio" required></textarea></label><label>Replace portrait (optional)<input name="portrait" type="file" accept="image/jpeg,image/png,image/webp"></label><button>Save profile</button></form><h2>Add work</h2><form id="work"><label>Title<input name="title" required maxlength="150"></label><label>Category<input name="category" required maxlength="60" placeholder="Portraits / Events / Commercial"></label><label>Type<select name="kind"><option value="image">Photo</option><option value="video">Film (MP4)</option></select></label><label>Upload<input name="media" type="file" accept="image/jpeg,image/png,image/webp,video/mp4" required></label><label>Cover image (required for film)<input name="cover" type="file" accept="image/jpeg,image/png,image/webp"></label><button>Publish work</button></form><h2>Manage collection</h2><div id="items"></div></div></main><script src="config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="admin.js"></script></body></html>
